name: cloud-deployment

on:
  workflow_dispatch:
    inputs:
      student:
        description: Student feature slice to validate and deploy
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read
  id-token: write

concurrency:
  group: homs-r2-cloud-student-${{ inputs.student }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Student ${{ inputs.student }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: student-${{ inputs.student }}/**/requirements.txt

      - name: Install selected Student dependencies
        env:
          STUDENT: ${{ inputs.student }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          while IFS= read -r requirements; do
            python -m pip install -r "$requirements"
          done < <(find "student-$STUDENT" -maxdepth 2 -name requirements.txt -type f | sort)

      - name: Run selected Student tests
        env:
          STUDENT: ${{ inputs.student }}
          AI_ENABLED: "false"
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"
        run: |
          PYTHONPATH="student-$STUDENT" python -m pytest -q "student-$STUDENT/tests"

      - name: Validate Compose and deployment definitions
        env:
          STUDENT: ${{ inputs.student }}
          AZURE_SUBSCRIPTION_ID: 00000000-0000-0000-0000-000000000000
          HOMS_AZURE_ACR_NAME: homsr2dryrunregistry
          HOMS_AZURE_STORAGE_ACCOUNT: homsr2dryrunstorage
        run: |
          docker compose config --quiet
          bash -n scripts/deploy/*.sh
          python -m compileall -q scripts/deploy
          ./scripts/deploy/azure-foundation.sh --dry-run
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            ./scripts/deploy/github-oidc-setup.sh --dry-run
          ./scripts/deploy/deploy-student.sh "$STUDENT" --tag "$GITHUB_SHA" --dry-run
          ./scripts/deploy/deployment-testing.sh "$STUDENT" --dry-run

  deploy:
    name: Deploy Student ${{ inputs.student }}
    needs: validate
    runs-on: ubuntu-latest
    environment: azure-r2
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      HOMS_AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      HOMS_AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      HOMS_AZURE_ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      HOMS_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      HOMS_AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      HOMS_APP_PREFIX: ${{ vars.AZURE_APP_PREFIX }}
      HOMS_ACR_PULL_IDENTITY: ${{ vars.AZURE_ACR_PULL_IDENTITY }}
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Validate required OIDC and foundation settings
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID secret is required}"
          : "${AZURE_TENANT_ID:?AZURE_TENANT_ID secret is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID secret is required}"
          : "${HOMS_AZURE_RESOURCE_GROUP:?AZURE_RESOURCE_GROUP variable is required}"
          : "${HOMS_AZURE_LOCATION:?AZURE_LOCATION variable is required}"
          : "${HOMS_AZURE_ACR_NAME:?AZURE_CONTAINER_REGISTRY variable is required}"
          : "${HOMS_CONTAINERAPPS_ENVIRONMENT:?AZURE_CONTAINERAPPS_ENVIRONMENT variable is required}"
          : "${HOMS_AZURE_STORAGE_ACCOUNT:?AZURE_STORAGE_ACCOUNT variable is required}"
          : "${HOMS_APP_PREFIX:?AZURE_APP_PREFIX variable is required}"
          : "${HOMS_ACR_PULL_IDENTITY:?AZURE_ACR_PULL_IDENTITY variable is required}"

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy only the selected Student slice
        id: deployment
        env:
          STUDENT: ${{ inputs.student }}
        run: ./scripts/deploy/deploy-student.sh "$STUDENT" --tag "$GITHUB_SHA"

      - name: Validate deployed services and cloud baseline
        env:
          STUDENT: ${{ inputs.student }}
          FRONTEND_URL: ${{ steps.deployment.outputs.frontend_url }}
        run: |
          ./scripts/deploy/deployment-testing.sh "$STUDENT" \
            --frontend-url "$FRONTEND_URL"

      - name: Record deployment summary
        if: always()
        env:
          STUDENT: ${{ inputs.student }}
          FRONTEND_URL: ${{ steps.deployment.outputs.frontend_url }}
        run: |
          {
            echo "## HOMS R2 cloud deployment"
            echo "- Student slice: $STUDENT"
            echo "- Immutable image tag: $GITHUB_SHA"
            echo "- Frontend: ${FRONTEND_URL:-deployment did not return a URL}"
            echo "- Baseline AI, MCP, RAG and Multi-Agent: disabled"
            echo "- Database: dedicated Azure Files share, one replica"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-${{ inputs.student }}-cloud-deployment-${{ github.sha }}
          path: .local-r2/cloud/
          if-no-files-found: warn
          retention-days: 30
