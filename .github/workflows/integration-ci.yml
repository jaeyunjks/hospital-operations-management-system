name: integration-ci

on:
  push:
    paths:
      - "student-5/**"
      - "shared/frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/integration-ci.yml"
  pull_request:
    paths:
      - "student-5/**"
      - "shared/frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student5-integration:
    runs-on: ubuntu-latest
    env:
      STUDENT5_AI_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            student-5/frontend/requirements.txt
            student-5/backend/requirements.txt
            student-5/database/requirements.txt

      - name: Install Student 5 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest \
            -r student-5/frontend/requirements.txt \
            -r student-5/backend/requirements.txt \
            -r student-5/database/requirements.txt

      - name: Run Student 5 tests
        run: python -m pytest -q student-5/tests

      - name: Validate shared Compose configuration
        run: docker compose config --quiet

      - name: Build Student 5 containers
        run: docker compose build student5-database student5-backend student5-frontend

      - name: Start Student 5 services
        run: docker compose up -d --wait --wait-timeout 120 student5-frontend

      - name: Verify Student 5 HTTP and AI-disabled fallback
        run: |
          python - <<'PY'
          import json
          import urllib.request

          def request(url, payload=None):
              body = json.dumps(payload).encode() if payload is not None else None
              headers = {"Accept": "application/json"}
              if body is not None:
                  headers["Content-Type"] = "application/json"
              call = urllib.request.Request(url, data=body, headers=headers)
              with urllib.request.urlopen(call, timeout=15) as response:
                  raw = response.read().decode()
                  result = (json.loads(raw) if raw and
                            response.headers.get_content_type() == "application/json"
                            else raw)
                  return response.status, result

          status, database = request("http://127.0.0.1:6500/health")
          assert status == 200 and database["status"] == "ok"

          status, backend = request("http://127.0.0.1:5500/health")
          assert status == 200
          assert backend["status"] == "ok"
          assert backend["ai_enabled"] is False
          assert backend["database_service"]["status"] == "ok"

          status, _ = request("http://127.0.0.1:3500/")
          assert status == 200

          _, summary = request(
              "http://127.0.0.1:5500/api/shifts/coverage-summary",
              {"narrate": True})
          assert summary["mode"] == "rule-based"
          assert summary["generation"]["source"] == "deterministic"
          assert summary["generation"]["fallback_reason"] == "ai_disabled"

          _, suggestions = request(
              "http://127.0.0.1:5500/api/shifts/suggest-staff",
              {"shift_id": 1})
          assert suggestions["mode"] == "rule-based"
          assert suggestions["ranking"]["source"] == "deterministic"
          assert suggestions["ranking"]["fallback_reason"] == "ai_disabled"
          PY

      - name: Show Student 5 container logs on failure
        if: failure()
        run: docker compose logs --no-color student5-database student5-backend student5-frontend

      - name: Stop Student 5 services
        if: always()
        run: docker compose down --volumes --remove-orphans
