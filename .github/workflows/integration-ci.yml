name: integration-ci

on:
  push:
    paths:
      - "student-1/**"
      - "student-2/**"
      - "student-3/**"
      - "student-4/**"
      - "student-5/**"
      - "shared/**"
      - "ai-services/**"
      - "docker-compose.yml"
      - ".github/workflows/integration-ci.yml"
  pull_request:
    paths:
      - "student-1/**"
      - "student-2/**"
      - "student-3/**"
      - "student-4/**"
      - "student-5/**"
      - "shared/**"
      - "ai-services/**"
      - "docker-compose.yml"
      - ".github/workflows/integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  group-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shared Compose configuration
        run: docker compose config --quiet

      - name: Verify all integrated service definitions
        run: |
          expected_services=(
            homs-homepage ollama
            student-1-database student-1-backend student-1-frontend
            student-2-database student-2-backend student-2-frontend
            student-3-database student-3-backend student-3-frontend
            student-4-database student-4-backend student-4-frontend
            student5-database student5-backend student5-frontend
          )
          actual_services="$(docker compose config --services)"
          for service in "${expected_services[@]}"; do
            grep -qx "$service" <<< "$actual_services"
          done
          docker compose config | grep -q 'OLLAMA'

      - name: Build integrated application
        run: docker compose build

      - name: Start integrated application
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test shared and feature services
        run: |
          python - <<'PY'
          import json
          import urllib.request

          def request(url, headers=None):
              call = urllib.request.Request(
                  url, headers=headers or {"Accept": "application/json"})
              with urllib.request.urlopen(call, timeout=15) as response:
                  raw = response.read().decode()
                  return response.status, raw

          homepage_status, homepage = request("http://127.0.0.1:3000/")
          assert homepage_status == 200
          for port in (3100, 3200, 3300, 3400, 3500):
              assert f"http://localhost:{port}/" in homepage

          for port in (3100, 3200, 3300, 3400, 3500):
              status, _ = request(f"http://127.0.0.1:{port}/")
              assert status == 200, port

          for port in (6100, 6200, 6300, 6400, 6500):
              status, _ = request(f"http://127.0.0.1:{port}/health")
              assert status == 200, port

          for port in (5200, 5300, 5400, 5500):
              status, _ = request(f"http://127.0.0.1:{port}/health")
              assert status == 200, port

          status, admission = request("http://127.0.0.1:5100/api/admissions/1")
          assert status == 200 and "admission_status" in admission

          status, records = request(
              "http://127.0.0.1:5200/api/clinical-records/",
              {"Accept": "application/json", "X-User-Role": "doctor"})
          assert status == 200
          assert isinstance(json.loads(records).get("clinical_records"), list)

          status, _ = request("http://127.0.0.1:11434/api/tags")
          assert status == 200
          PY

      - name: Show integrated service logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color

      - name: Stop integrated application
        if: always()
        run: docker compose down --volumes --remove-orphans
