name: student-1 CI

on:
  push:
    paths:
      - "student-1/**"
      - ".github/workflows/student-1.yml"
  pull_request:
    paths:
      - "student-1/**"
      - ".github/workflows/student-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            student-1/backend/requirements.txt
            student-1/frontend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r student-1/backend/requirements.txt
          python -m pip install -r student-1/frontend/requirements.txt
          python -m pip install pytest

      - name: Compile Python files
        run: python -m compileall -q student-1

      - name: Run student-1 tests
        env:
          PYTHONPATH: student-1
        run: python -m pytest -q student-1/tests

  docker:
    name: Build student-1 images
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f student-1/backend/Dockerfile -t student-1-backend:ci student-1

      - name: Build top-level student-1 image
        run: docker build -f student-1/Dockerfile -t student-1:ci student-1

      - name: Build frontend image
        run: docker build -f student-1/frontend/Dockerfile -t student-1-frontend:ci student-1

      - name: Build database image
        run: docker build -f student-1/database/Dockerfile -t student-1-database:ci student-1
