name: student-2

on:
  push:
    paths:
      - "student-2/**"
      - "student-1/**"
      - "shared/frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/student-2.yml"
  pull_request:
    paths:
      - "student-2/**"
      - "student-1/**"
      - "shared/frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/student-2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student2-integration:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
      STUDENT2_MCP_ENABLED: "false"
      STUDENT2_RAG_ENABLED: "false"
      STUDENT2_MULTI_AGENT_ENABLED: "false"
      # Only the Student 2 containers run in CI, so the Patient & Admission
      # service is not reachable. The local stub treats every admission as
      # active, which creating a clinical record needs.
      STUDENT2_USE_EXTERNAL_STUBS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            student-2/frontend/requirements.txt
            student-2/backend/requirements.txt
            student-2/database/requirements.txt

      - name: Install Student 2 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest \
            -r student-2/frontend/requirements.txt \
            -r student-2/backend/requirements.txt \
            -r student-2/database/requirements.txt

      - name: Run Student 2 tests
        run: |
          mkdir -p test-results/student-2
          python -m pytest -q student-2/tests \
            --junitxml=test-results/student-2/unit.xml

      - name: Validate shared Compose configuration
        run: docker compose config --quiet

      - name: Build Student 2 containers
        run: docker compose build student-2-database student-2-backend student-2-frontend

      - name: Start Student 2 services
        # STUDENT2_USE_EXTERNAL_STUBS, set in the job env, keeps the Patient &
        # Admission service out of the picture.
        run: docker compose up -d --wait --wait-timeout 120 student-2-frontend

      - name: Verify Student 2 HTTP services
        run: |
          python - <<'PY'
          import json
          import urllib.request

          def request(url, headers=None):
              call = urllib.request.Request(url, headers=headers or {"Accept": "application/json"})
              with urllib.request.urlopen(call, timeout=15) as response:
                  raw = response.read().decode()
                  return response.status, response.headers.get_content_type(), raw

          def json_response(url, headers=None):
              status, content_type, raw = request(url, headers)
              assert status == 200
              assert content_type == "application/json"
              return json.loads(raw)

          database = json_response("http://127.0.0.1:6200/health")
          assert database["status"] == "ok"

          backend = json_response("http://127.0.0.1:5200/health")
          assert backend["status"] == "ok"

          records = json_response(
              "http://127.0.0.1:5200/api/clinical-records/",
              {"Accept": "application/json", "X-User-Role": "doctor"})
          assert isinstance(records.get("clinical_records"), list)

          status, content_type, html = request("http://127.0.0.1:3200/")
          assert status == 200
          assert content_type == "text/html"
          assert "<!DOCTYPE html>" in html
          PY

      - name: Run Student 2 backend endpoint tests
        # Release 2: two backend endpoint functions (acknowledge a care task,
        # create a clinical record) tested against the running containers.
        env:
          STUDENT2_BACKEND_URL: http://localhost:5200
        run: |
          mkdir -p test-results/student-2
          python -m pytest -v student-2/tests/test_endpoints_ci.py \
            --junitxml=test-results/student-2/junit.xml

      - name: Upload endpoint test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-2-junit
          path: |
            test-results/student-2/unit.xml
            test-results/student-2/junit.xml
          if-no-files-found: error

      - name: Verify Student 2 MCP, RAG and Multi-Agent are disabled
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          print("MCP_ENABLED =", os.environ.get("MCP_ENABLED"))
          print("RAG_ENABLED =", os.environ.get("RAG_ENABLED"))
          print("MULTI_AGENT_ENABLED =", os.environ.get("MULTI_AGENT_ENABLED"))

          def read_status(url):
              # The status routes need a clinical role; they only read local config
              # when disabled, so no MCP, RAG or Multi-Agent server is contacted here.
              call = urllib.request.Request(
                  url, headers={"Accept": "application/json", "X-User-Role": "doctor"})
              try:
                  with urllib.request.urlopen(call, timeout=15) as response:
                      return json.loads(response.read().decode()).get("status")
              except (urllib.error.URLError, ValueError) as exc:
                  return "unreadable ({})".format(type(exc).__name__)

          results = {
              "MCP": read_status("http://127.0.0.1:5200/api/mcp/status"),
              "RAG": read_status("http://127.0.0.1:5200/api/rag/status"),
              "Multi-Agent": read_status("http://127.0.0.1:5200/api/multi-agent/status"),
          }
          for name, state in results.items():
              print("{} status: {}".format(name, state))

          bad = [name for name, state in results.items() if state != "disabled"]
          if bad:
              sys.exit("FAIL: {} must be disabled in CI".format(" and ".join(bad)))
          print("MCP, RAG and Multi-Agent are retained in the code and disabled for CI")
          PY

      - name: Show Student 2 container logs on failure
        if: failure()
        run: docker compose logs --no-color student-2-database student-2-backend student-2-frontend

      - name: Stop Student 2 services
        if: always()
        run: docker compose down --volumes --remove-orphans
