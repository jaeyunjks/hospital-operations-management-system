repos:
  - repo: local
    hooks:
      - id: ruff-security
        name: Ruff security rules (S)
        entry: ruff check --config ruff.toml
        language: system
        types: [python]
        require_serial: true

      - id: detect-secrets
        name: detect-secrets (committed secrets)
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
        exclude: >-
          ^(.secrets.baseline|reports/multi-agent/|docs/agent-logs/|.local-r2/|student-5/(playwright-cli|.playwright-cli|output/playwright)/)

      - id: pip-audit-requirements
        name: pip-audit (all service requirements)
        entry: scripts/security/audit-requirements.sh
        language: system
        pass_filenames: false
        files: >-
          ^(.pre-commit-config.yaml|scripts/security/audit-requirements.sh|(student-[1-5]|ai-services)/.+/requirements[^/]*.txt)$

