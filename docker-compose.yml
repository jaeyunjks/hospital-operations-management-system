# Shared HOMS development stack.
# Student 4 and Student 5 services are wired into this root Compose file.

services:
  # --- student-5 — Staff & Shift Management ----------------------------
  student5-database:
    build:
      context: .
      dockerfile: student-5/database/Dockerfile
    environment:
      DATABASE_SERVICE_PORT: "6500"
      STUDENT5_DATABASE_PATH: /data/staff_shift.db
    ports:
      - "6500:6500"
    volumes:
      - student5-database-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6500/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  student5-backend:
    build:
      context: .
      dockerfile: student-5/backend/Dockerfile
    environment:
      BACKEND_PORT: "5500"
      DATABASE_SERVICE_URL: "${STUDENT5_DATABASE_SERVICE_URL:-http://student5-database:6500}"
      AI_ENABLED: "${STUDENT5_AI_ENABLED:-true}"
      OLLAMA_URL: "${STUDENT5_OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${STUDENT5_OLLAMA_MODEL:-llama3.1:8b}"
      OLLAMA_TIMEOUT: "${STUDENT5_OLLAMA_TIMEOUT:-30}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5500:5500"
    depends_on:
      student5-database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5500/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  student5-frontend:
    build:
      context: .
      dockerfile: student-5/frontend/Dockerfile
    environment:
      FRONTEND_PORT: "3500"
      STAFF_SHIFT_API_URL: "${STUDENT5_API_URL:-http://student5-backend:5500}"
      STAFF_SHIFT_API_TIMEOUT: "5"
      STAFF_SHIFT_SUMMARY_API_TIMEOUT: "${STUDENT5_SUMMARY_API_TIMEOUT:-35}"
      HOMS_SECRET_KEY: "${STUDENT5_HOMS_SECRET_KEY:-student5-docker-development-key}"
    ports:
      - "3500:3500"
    depends_on:
      student5-backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3500/', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # --- shared AI runtime ------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: homs-ollama
    ports: ["11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]
    networks: [homs-net]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # --- student-4 — Room & Bed Management (Jisoo Jung / Asher) -----------
  student-4-database:
    build:
      context: ./student-4/database
    container_name: s4-database
    environment:
      PORT: 6400
      DB_PATH: /app/rooms.db
      FLASK_DEBUG: 0
    ports: ["6400:6400"]
    networks: [homs-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:6400/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  student-4-backend:
    build:
      context: ./student-4/backend
    container_name: s4-backend
    environment:
      PORT: 5400
      DATABASE_URL: http://student-4-database:6400
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT: 30
      AUTH_ENABLED: 0
      FLASK_DEBUG: 0
    ports: ["5400:5400"]
    depends_on:
      student-4-database:
        condition: service_healthy
    networks: [homs-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5400/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  student-4-frontend:
    # Built from the repository root: the page links shared/frontend, which
    # sits outside this student's folder.
    build:
      context: .
      dockerfile: student-4/frontend/Dockerfile
    container_name: s4-frontend
    environment:
      PORT: 3400
      BACKEND_URL: http://student-4-backend:5400
      FLASK_DEBUG: 0
    ports: ["3400:3400"]
    depends_on:
      student-4-backend:
        condition: service_healthy
    networks: [homs-net]

networks:
  homs-net:
    driver: bridge

volumes:
  student5-database-data:
  ollama-models:
