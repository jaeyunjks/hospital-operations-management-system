# ==========================================================================
# Hospital Operations Management System — Docker Compose
# ==========================================================================
# Runs the integrated multi-container application locally.
#
# Ports follow the HOMS architecture diagram: each student owns a
# 3N00 (UI) / 5N00 (API) / 6N00 (DB) block.
#   student-1  3100 / 5100 / 6100      student-4  3400 / 5400 / 6400
#   student-2  3200 / 5200 / 6200      student-5  3500 / 5500 / 6500
#   student-3  3300 / 5300 / 6300      shared auth 3000 / 5000
#
# ==========================================================================
services:
  student-1-database:
    build:
      context: ./student-1
      dockerfile: database/Dockerfile
    container_name: student-1-database
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      PORT: 6100
      FLASK_DEBUG: 0
    ports:
      - "6100:6100"
    command: python -m database.app

  student-1-backend:
    build:
      context: ./student-1
      dockerfile: backend/Dockerfile
    container_name: student-1-backend
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      PORT: 5100
      DATABASE_URL: http://student-1-database:6100
      FLASK_DEBUG: 0
    depends_on:
      - student-1-database
    ports:
      - "5100:5100"
    command: python -m backend.app

  student-1-frontend:
    build:
      context: ./student-1
      dockerfile: frontend/Dockerfile
    container_name: student-1-frontend
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      BACKEND_URL: http://student-1-backend:5100
      FLASK_DEBUG: 0
    depends_on:
      - student-1-backend
    ports:
      - "3100:3100"
    command: python app.py

networks:
  default:
    name: hospital-operations-management-system_default
