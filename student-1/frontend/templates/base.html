<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }} | HOMS</title>
    <meta name="description" content="Patient and admissions operations interface." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <header class="side-nav">
        <div class="nav-brand">
          <span class="brand-mark">HOMS</span>
          <span class="brand-label">Patient &amp; Admissions</span>
        </div>

        <nav aria-label="Feature navigation">
          <ul class="nav-list">
            {% for item in nav %}
            <li>
              <a href="{{ item.href }}" class="nav-item {% if item.id == active_page %}is-active{% endif %}">{{ item.label }}</a>
            </li>
            {% endfor %}
          </ul>
        </nav>

        <div class="nav-user">
          <span class="user-name">{{ identity.name }}</span>
          <span class="user-role">{{ identity.role }}</span>
        </div>
      </header>

      <main class="page-shell">
        {% block content %}{% endblock %}
      </main>

    </div>

    <!-- <script>
      window.setInterval(function () {
        if (document.visibilityState === 'visible' && window.location.pathname !== '/intake') {
          window.location.reload();
        }
      }, 12000);
    </script> -->
  </body>
</html>
