{% extends "base.html" %}

{% block content %}
<header class="page-header">
  <div class="context-line">{{ page_context }}</div>
  <div class="header-row">
    <div>
      <h1>{{ page_title }}</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary">Save draft</button>
      <button class="btn btn-primary">Submit intake</button>
    </div>
  </div>
</header>

<section class="panel">
  <div class="panel-header">
    <div>
      <span class="eyebrow">Entry form</span>
      <h2>New patient intake</h2>
    </div>
  </div>

  <form class="form-grid" method="post">
    <div class="field-group">
      <label for="title">Title{% if errors.title %}<span class="required-star">*</span>{% endif %}</label>
      <select id="title" name="title">
        <option>Mr</option>
        <option>Mrs</option>
        <option>Ms</option>
        <option>Dr</option>
      </select>
    </div>

    <div class="field-group">
      <label for="first_name">First name{% if errors.first_name %}<span class="required-star">*</span>{% endif %}</label>
      <input id="first_name" name="first_name" type="text" value="{{ form.get('first_name', '') }}" placeholder="Enter first name" />
    </div>

    <div class="field-group">
      <label for="last_name">Last name{% if errors.last_name %}<span class="required-star">*</span>{% endif %}</label>
      <input id="last_name" name="last_name" type="text" value="{{ form.get('last_name', '') }}" placeholder="Enter last name" />
    </div>

    <div class="field-group">
      <label for="dob">Date of birth{% if errors.dob %}<span class="required-star">*</span>{% endif %}</label>
      <input id="dob" name="dob" type="date" value="{{ form.get('dob', '') }}" />
    </div>

    <div class="field-group">
      <label for="sex">Sex{% if errors.sex %}<span class="required-star">*</span>{% endif %}</label>
      <select id="sex" name="sex">
        <option>Male</option>
        <option>Female</option>
        <option>Alternate</option>
        <option>Unassigned</option>
      </select>
    </div>

    <div class="field-group">
      <label for="mobile">Mobile{% if errors.mobile %}<span class="required-star">*</span>{% endif %}</label>
      <input id="mobile" name="mobile" type="tel" value="{{ form.get('mobile', '') }}" placeholder="0412 345 678" />
    </div>

    <div class="field-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="patient@email.com" />
    </div>

    <div class="field-group wide">
      <label for="address">Address{% if errors.address %}<span class="required-star">*</span>{% endif %}</label>
      <input id="address" name="address" type="text" value="{{ form.get('address', '') }}" placeholder="Street address" />
    </div>

    <div class="field-group">
      <label for="suburb">Suburb{% if errors.suburb %}<span class="required-star">*</span>{% endif %}</label>
      <input id="suburb" name="suburb" type="text" value="{{ form.get('suburb', '') }}" placeholder="Suburb" />
    </div>

    <div class="field-group">
      <label for="state">State{% if errors.state %}<span class="required-star">*</span>{% endif %}</label>
      <select id="state" name="state">
        <option>New South Wales</option>
        <option>Victoria</option>
        <option>Queensland</option>
        <option>Western Australia</option>
        <option>South Australia</option>
        <option>Tasmania</option>
        <option>Northern Territory</option>
        <option>Australian Capital Territory</option>
      </select>
    </div>

    <div class="field-group">
      <label for="postcode">Postcode{% if errors.postcode %}<span class="required-star">*</span>{% endif %}</label>
      <input id="postcode" name="postcode" type="text" value="{{ form.get('postcode', '') }}" placeholder="0000" />
    </div>

    <div class="field-group">
      <label for="insurance">Insurance</label>
      <select id="insurance" name="insurance">
        <option>Medicare</option>
        <option>Private</option>
        <option>Centrelink</option>
      </select>
    </div>

    <div class="field-group">
      <label for="medicare_number">Medicare number{% if errors.medicare_number %}<span class="required-star">*</span>{% endif %}</label>
      <input id="medicare_number" name="medicare_number" type="text" value="{{ form.get('medicare_number', '') }}" placeholder="123456780" />
    </div>

    <div class="field-group wide">
      <label for="notes">Brief intake notes</label>
      <textarea id="notes" name="notes" rows="4" placeholder="Reason for presentation, referral, interpreter needs, family contact..."></textarea>
    </div>

    <div class="field-group wide submit-row">
      <button class="btn btn-primary" type="submit">Submit intake</button>
      <button class="btn btn-secondary" type="submit" name="emergency_override" value="1">Emergency override</button>
    </div>
  </form>

  {% if submitted %}
  <div class="banner banner-ok">
    {% if message %}{{ message }}{% else %}Intake details captured. Review the record before final registration.{% endif %}
  </div>
  {% endif %}
</section>
{% endblock %}
