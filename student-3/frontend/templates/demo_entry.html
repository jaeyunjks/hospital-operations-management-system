<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a role — Pharmacy Operations</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/demo.css') }}">
</head>
<body class="demo-entry">
  <main class="demo-panel">
    <header class="brand">
      <span class="brand__name">HOMS</span>
      <span class="brand__module">Pharmacy Operations</span>
    </header>

    <section class="notice" aria-label="Demonstration information">
      <h1>Release 0 demonstration mode</h1>
      <p>This is not a login. Choose a role and a seeded staff member to demonstrate the pharmacy workflow.</p>
    </section>

    {% if error %}
    <p class="error" role="alert">{{ error }} Run <code>python3 init_db.py --check</code> in <code>student-3/database</code>.</p>
    {% endif %}

    <form method="post" action="{{ url_for('demo_enter') }}" id="demo-form">
      <fieldset class="roles">
        <legend>Continue as</legend>

        <label class="role-card">
          <input type="radio" name="role" value="{{ role_manager }}" {% if selected_role == role_manager %}checked{% endif %}>
          <span>
            <strong>Pharmacy Manager</strong>
            <small>Oversees pharmacy operations, stock, and approvals.</small>
          </span>
        </label>

        <label class="role-card">
          <input type="radio" name="role" value="{{ role_pharmacist }}" {% if selected_role == role_pharmacist %}checked{% endif %}>
          <span>
            <strong>Pharmacist</strong>
            <small>Manages dispensing and day-to-day pharmacy work.</small>
          </span>
        </label>
      </fieldset>

      <div class="person-picker" id="person-picker" hidden>
        <label for="staff_id">Select a person</label>
        <select id="staff_id" name="staff_id" disabled required>
          <option value="">Choose a role first</option>
        </select>
      </div>

      <button type="submit" id="continue-button" disabled>Continue</button>
    </form>
  </main>

  <script>
    const people = {{ people | tojson }};
    const selectedStaffId = {{ selected_staff_id | tojson }};
    const picker = document.getElementById('person-picker');
    const select = document.getElementById('staff_id');
    const button = document.getElementById('continue-button');
    const radios = document.querySelectorAll('input[name="role"]');

    function updatePeople() {
      const checked = document.querySelector('input[name="role"]:checked');
      const role = checked ? checked.value : '';
      select.replaceChildren();
      const placeholder = new Option(role ? 'Select a person' : 'Choose a role first', '');
      select.add(placeholder);
      (people[role] || []).forEach((person) => {
        const option = new Option(person.name, String(person.staff_id));
        option.selected = String(person.staff_id) === String(selectedStaffId);
        select.add(option);
      });
      picker.hidden = !role;
      select.disabled = !role;
      button.disabled = !role || !select.value;
    }

    radios.forEach((radio) => radio.addEventListener('change', updatePeople));
    select.addEventListener('change', () => {
      button.disabled = !select.value;
    });
    updatePeople();
  </script>
</body>
</html>
