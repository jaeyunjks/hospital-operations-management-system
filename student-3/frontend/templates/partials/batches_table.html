{%for b in batches%}<tr><td>{{b.medicine_name}}</td><td>{{b.batch_number}}</td><td>{{b.expiry_date}}</td><td>{{b.days_until_expiry}}</td><td>{{b.quantity_remaining}}</td><td>${{b.estimated_value}}</td><td><span class="badge {%if b.expiry_status=='expired'%}badge-danger{%elif b.expiry_status=='expiring_soon'%}badge-warning{%else%}badge-success{%endif%}">{{b.expiry_status}}</span></td><td>{%if is_manager and b.quantity_remaining%}<form hx-post="/batches/{{b.batch_id}}/write-off" hx-target="this" hx-confirm="Write off {{b.quantity_remaining}} units of {{b.medicine_name}}, batch {{b.batch_number}}? This creates a waste record in the stock ledger and cannot be undone."><input class="input" name="reason" value="Expired" required><button class="btn btn-danger btn-compact">Write off</button></form>{%endif%}</td></tr>{%else%}<tr><td colspan="8">No batches match.</td></tr>{%endfor%}
