<section class="panel"><div class="panel__header"><h2 class="panel__title">{{ 'Edit medicine' if medicine else 'Add medicine' }}</h2></div><div class="panel__body">{% if error %}<div class="alert alert--danger"><div><p class="alert__body">{{ error }}</p></div></div>{% endif %}<form class="stack" method="post" action="/medicines/save"><input type="hidden" name="medicine_id" value="{{ medicine.medicine_id if medicine else '' }}"><div class="field"><label class="field__label">Name<input class="input" name="name" required value="{{ medicine.name if medicine else '' }}"></label></div><div class="field"><label class="field__label">Category<input class="input" name="category" required value="{{ medicine.category if medicine else '' }}"></label></div><div class="field"><label class="field__label">Unit<input class="input" name="unit" required value="{{ medicine.unit if medicine else '' }}"></label></div><div class="field"><label class="field__label">Unit price<input class="input" type="number" min="0" step="0.01" name="unit_price" required value="{{ medicine.unit_price if medicine else '' }}"></label></div><div class="field"><label class="field__label">Stock quantity<input class="input" type="number" min="0" name="stock_quantity" value="{{ medicine.stock_quantity if medicine else 0 }}"></label></div><div class="field"><label class="field__label">Reorder level<input class="input" type="number" min="0" name="reorder_level" required value="{{ medicine.reorder_level if medicine else '' }}"></label></div><div class="field"><label class="field__label">Supplier<select class="select" name="supplier_id" required>{% for supplier in suppliers %}<option value="{{ supplier.supplier_id }}" {% if medicine and medicine.supplier_id == supplier.supplier_id %}selected{% endif %}>{{ supplier.name }}</option>{% endfor %}</select></label></div><div class="field"><label class="field__label">Storage instructions<textarea class="textarea" name="storage_instructions">{{ medicine.storage_instructions if medicine else '' }}</textarea></label></div><button class="btn btn-primary" type="submit">Save medicine</button></form></div></section>
