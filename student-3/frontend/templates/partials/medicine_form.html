<div class="modal" role="dialog" aria-modal="true" aria-labelledby="medicine-form-title">
  <button class="modal__backdrop" type="button" aria-label="Close medicine form" onclick="this.closest('.modal-root').replaceChildren()"></button>
  <section class="panel modal__dialog">
    <div class="panel__header">
      <h2 class="panel__title" id="medicine-form-title">{{ 'Edit medicine' if medicine else 'Add medicine' }}</h2>
      <button class="btn btn-ghost btn-compact modal__close" type="button" aria-label="Close" onclick="this.closest('.modal-root').replaceChildren()">Close</button>
    </div>
    <div class="panel__body">
      {% if error %}<div class="alert alert--danger"><div><p class="alert__body">{{ error }}</p></div></div>{% endif %}
      <form class="stack modal-form" method="post" action="/medicines/save">
        <input type="hidden" name="medicine_id" value="{{ medicine.medicine_id if medicine else '' }}">
        <div class="modal-form__field"><label class="field__label" for="medicine-name">Name</label><input class="input" id="medicine-name" name="name" required value="{{ medicine.name if medicine else '' }}"></div>
        <div class="modal-form__field"><label class="field__label" for="medicine-category">Category</label><input class="input" id="medicine-category" name="category" required value="{{ medicine.category if medicine else '' }}"></div>
        <div class="modal-form__field"><label class="field__label" for="medicine-unit">Unit</label><input class="input" id="medicine-unit" name="unit" required value="{{ medicine.unit if medicine else '' }}"></div>
        <div class="modal-form__field"><label class="field__label" for="medicine-unit-price">Unit price</label><input class="input" id="medicine-unit-price" type="number" min="0" step="0.01" name="unit_price" required value="{{ medicine.unit_price if medicine else '' }}"></div>
        <div class="modal-form__field"><label class="field__label" for="medicine-stock-quantity">Stock quantity</label><input class="input" id="medicine-stock-quantity" type="number" min="0" name="stock_quantity" value="{{ medicine.stock_quantity if medicine else 0 }}"></div>
        <div class="modal-form__field"><label class="field__label" for="medicine-reorder-level">Reorder level</label><input class="input" id="medicine-reorder-level" type="number" min="0" name="reorder_level" required value="{{ medicine.reorder_level if medicine else '' }}"></div>
        <div class="modal-form__field"><label class="field__label" for="medicine-supplier">Supplier</label><select class="select" id="medicine-supplier" name="supplier_id" required>{% for supplier in suppliers %}<option value="{{ supplier.supplier_id }}" {% if medicine and medicine.supplier_id == supplier.supplier_id %}selected{% endif %}>{{ supplier.name }}</option>{% endfor %}</select></div>
        <div class="modal-form__field modal-form__field--textarea"><label class="field__label" for="medicine-storage-instructions">Storage instructions</label><textarea class="textarea" id="medicine-storage-instructions" name="storage_instructions">{{ medicine.storage_instructions if medicine else '' }}</textarea></div>
        <div class="modal__actions"><button class="btn btn-ghost" type="button" onclick="this.closest('.modal-root').replaceChildren()">Cancel</button><button class="btn btn-primary" type="submit">Save medicine</button></div>
      </form>
    </div>
  </section>
</div>
