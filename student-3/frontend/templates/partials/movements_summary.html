<div class="stat-row">{% for kind, label in [('receive', 'Received'), ('issue', 'Issued'), ('adjust', 'Adjusted'), ('waste', 'Wasted')] %}<div class="stat-card"><span class="stat__label">{{ label }}</span><strong class="stat__value{% if kind == 'waste' %} stat__value--danger{% endif %}">{{ summary.get(kind, {}).get('count', 0) }}</strong><span class="stat__meta">{{ summary.get(kind, {}).get('quantity', 0) }} units</span></div>{% endfor %}</div>
