<section class="panel"><div class="panel__body"><h2 class="panel__title">Issue or receive {{ medicine.name }}</h2><p>Available quantity: {{ medicine.available_quantity }}</p><form class="stack" hx-post="/medicines/{{ medicine.medicine_id }}/issue" hx-target="#stock-result"><input class="input" name="quantity" type="number" min="1" required placeholder="Issue quantity"><input class="input" name="reason" required placeholder="Ward or reason"><button class="btn btn-primary">Issue stock</button></form><form class="stack" hx-post="/medicines/{{ medicine.medicine_id }}/receive" hx-target="#stock-result"><input class="input" name="batch_number" required placeholder="Batch number"><input class="input" name="expiry_date" type="date" required><input class="input" name="quantity" type="number" min="1" required placeholder="Delivery quantity"><button class="btn btn-secondary">Receive delivery</button></form><div id="stock-result"></div></div></section>
