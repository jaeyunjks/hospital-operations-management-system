<div class="modal" role="dialog" aria-modal="true" aria-labelledby="supplier-form-title"><button class="modal__backdrop" type="button" aria-label="Close supplier form" onclick="this.closest('.modal-root').replaceChildren()"></button><section class="panel modal__dialog"><div class="panel__header"><h2 class="panel__title" id="supplier-form-title">{{ 'Edit supplier' if supplier else 'Add supplier' }}</h2><button class="btn btn-ghost btn-compact modal__close" type="button" aria-label="Close" onclick="this.closest('.modal-root').replaceChildren()">Close</button></div><div class="panel__body">{% if error %}<div class="alert alert--danger"><div><p class="alert__body">{{ error }}</p></div></div>{% endif %}<form class="stack" method="post" action="/suppliers/save"><input type="hidden" name="supplier_id" value="{{ supplier.supplier_id if supplier else '' }}"><div class="field"><label class="field__label" for="name">Name</label><input class="input" id="name" name="name" required value="{{ supplier.name if supplier else '' }}"></div><div class="field"><label class="field__label" for="contact_email">Contact email</label><input class="input" id="contact_email" name="contact_email" value="{{ supplier.contact_email if supplier else '' }}"></div><div class="field"><label class="field__label" for="phone">Phone</label><input class="input" id="phone" name="phone" value="{{ supplier.phone if supplier else '' }}"></div><div class="field"><label class="field__label" for="lead_time_days">Lead time (days)</label><input class="input" id="lead_time_days" type="number" min="0" name="lead_time_days" required value="{{ supplier.lead_time_days if supplier else '' }}"></div><div class="modal__actions"><button class="btn btn-ghost" type="button" onclick="this.closest('.modal-root').replaceChildren()">Cancel</button><button class="btn btn-primary" type="submit">Save supplier</button></div></form></div></section></div>
