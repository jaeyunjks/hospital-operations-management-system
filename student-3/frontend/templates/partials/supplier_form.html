<section class="panel"><div class="panel__header"><h2 class="panel__title">{{ 'Edit supplier' if supplier else 'Add supplier' }}</h2></div><div class="panel__body">{% if error %}<div class="alert alert--danger"><div><p class="alert__body">{{ error }}</p></div></div>{% endif %}<form class="stack" method="post" action="/suppliers/save"><input type="hidden" name="supplier_id" value="{{ supplier.supplier_id if supplier else '' }}"><div class="field"><label class="field__label" for="name">Name</label><input class="input" id="name" name="name" required value="{{ supplier.name if supplier else '' }}"></div><div class="field"><label class="field__label" for="contact_email">Contact email</label><input class="input" id="contact_email" name="contact_email" value="{{ supplier.contact_email if supplier else '' }}"></div><div class="field"><label class="field__label" for="phone">Phone</label><input class="input" id="phone" name="phone" value="{{ supplier.phone if supplier else '' }}"></div><div class="field"><label class="field__label" for="lead_time_days">Lead time (days)</label><input class="input" id="lead_time_days" type="number" min="0" name="lead_time_days" required value="{{ supplier.lead_time_days if supplier else '' }}"></div><button class="btn btn-primary" type="submit">Save supplier</button></form></div></section>
