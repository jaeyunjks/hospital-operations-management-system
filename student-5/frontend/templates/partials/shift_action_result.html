<div class="drawer__header">
  <h2 class="u-label" id="shift-drawer-heading">{{ title }}</h2>
  <button class="drawer__close" type="button" data-drawer-close aria-label="Close">×</button>
</div>
<div class="drawer__body">
  <div class="alert alert--success" role="status">
    <div><p class="alert__title">{{ title }}</p><p class="alert__body">{{ message }}</p></div>
  </div>
  <button class="btn-secondary" type="button" data-drawer-close>Close</button>
</div>
