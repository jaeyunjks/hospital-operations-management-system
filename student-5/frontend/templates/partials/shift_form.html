<div class="drawer__header">
  <h2 class="u-label" id="shift-drawer-heading">{{ 'Create shift' if mode == 'create' else 'Edit shift' }}</h2>
  <button class="drawer__close" type="button" data-drawer-close aria-label="Close shift form">×</button>
</div>

<form class="drawer__body shift-form"
      hx-post="{{ '/partials/shifts' if mode == 'create' else '/partials/shifts/' ~ shift_id }}"
      hx-target="#shift-drawer" hx-swap="innerHTML"
      hx-indicator="#loading-indicator">
  {% if error %}
  <div class="alert alert--danger" role="alert">
    <div>
      <p class="alert__title">Shift was not saved</p>
      <p class="alert__body">{{ error }}</p>
    </div>
  </div>
  {% endif %}

  <p class="drawer__muted">
    Use the operational fields accepted by the Staff &amp; Shift API. Shift IDs are assigned by the service.
  </p>

  <div class="shift-form__grid">
    <label class="filter shift-form__wide">
      <span class="filter__label">Department</span>
      <input class="input" name="department" value="{{ values.department }}" required>
    </label>
    <label class="filter">
      <span class="filter__label">Shift date</span>
      <input class="input" name="shift_date" type="date" value="{{ values.shift_date }}" required>
    </label>
    <label class="filter">
      <span class="filter__label">Required role</span>
      <input class="input" name="required_role" value="{{ values.required_role }}" required>
    </label>
    <label class="filter">
      <span class="filter__label">Start time</span>
      <input class="input" name="start_time" type="time" value="{{ values.start_time }}" required>
    </label>
    <label class="filter">
      <span class="filter__label">End time</span>
      <input class="input" name="end_time" type="time" value="{{ values.end_time }}" required>
    </label>
    <label class="filter">
      <span class="filter__label">Required staff count</span>
      <input class="input" name="required_staff_count" type="number" min="1" step="1"
             value="{{ values.required_staff_count }}" required>
    </label>
    <label class="filter">
      <span class="filter__label">Shift status</span>
      <select class="select" name="shift_status">
        {% for status in statuses %}
        <option value="{{ status }}" {% if values.shift_status == status %}selected{% endif %}>{{ status }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="filter shift-form__wide">
      <span class="filter__label">Notes <span class="u-muted">(optional)</span></span>
      <textarea class="textarea" name="notes" rows="4">{{ values.notes }}</textarea>
    </label>
  </div>

  <div class="drawer-actions">
    <button class="btn-primary" type="submit">{{ 'Create shift' if mode == 'create' else 'Save changes' }}</button>
    <button class="btn-secondary" type="button" data-drawer-close>Cancel</button>
  </div>
</form>
